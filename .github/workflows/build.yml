name: Build Advanced File Recovery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FileRecoveryPro.sln

      - name: Build (Release)
        run: dotnet build FileRecoveryPro.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test FileRecoveryPro.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Print failing test details as annotations
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path TestResults -Filter *.trx -Recurse | Select-Object -First 1
          if ($trx) {
            [xml]$xml = Get-Content $trx.FullName
            $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
            $ns.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
            $failed = $xml.SelectNodes("//t:UnitTestResult[@outcome='Failed']", $ns)
            Write-Host "Failed test count: $($failed.Count)"
            foreach ($f in $failed) {
              $testName = $f.testName
              $msgNode = $f.SelectSingleNode("t:Output/t:ErrorInfo/t:Message", $ns)
              $stackNode = $f.SelectSingleNode("t:Output/t:ErrorInfo/t:StackTrace", $ns)
              $msg = if ($msgNode) { $msgNode.InnerText -replace "`r`n","  " -replace "`n","  " } else { "failed" }
              $stack = if ($stackNode) { $stackNode.InnerText -replace "`r`n","  " -replace "`n","  " } else { "" }
              Write-Host "::error::TEST FAILED: $testName -- $msg -- $stack"
            }
          } else {
            Write-Host "No trx file found."
          }

      - name: Report test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Publish portable single-file EXE
        run: >
          dotnet publish src/FileRecovery.App/FileRecovery.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedFileRecovery-win-x64
          path: |
            publish/AdvancedFileRecovery.exe
            publish/*.pdb
          if-no-files-found: error

      - name: Upload full publish folder (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedFileRecovery-publish-full
          path: publish/
          if-no-files-found: error
